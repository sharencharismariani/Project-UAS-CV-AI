{% extends "base.html" %}

{% block title %}Daftar Akun - CVku{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 480px;">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Daftar Akun CVku</h1>
      <p class="auth-subtitle">Buat akun mahasiswa baru di jejaring CVku</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="nama" class="form-label">Nama Lengkap <span class="required">*</span></label>
        <input type="text" id="nama" name="nama" class="form-control" placeholder="Contoh: Sharen Charismariani" required value="{{ form_data.nama if form_data else '' }}">
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Username <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Contoh: sharen123" required value="{{ form_data.username if form_data else '' }}">
        <div class="form-hint">Hanya huruf, angka, dan garis bawah tanpa spasi.</div>
      </div>

      <input type="hidden" name="peran" value="mahasiswa">

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6">
        </div>

        <div class="form-group">
          <label for="konfirmasi_password" class="form-label">Ulangi Password <span class="required">*</span></label>
          <input type="password" id="konfirmasi_password" name="konfirmasi_password" class="form-control" placeholder="Ketik ulang password" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Daftar Sekarang
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted);">
      Sudah memiliki akun? <a href="{{ url_for('login') }}" style="font-weight: 600;">Masuk di sini</a>
    </div>
  </div>
</div>
{% endblock %}
